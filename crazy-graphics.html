<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crazy Graphics</title>
  <style>
    :root {
      --bg: #070b16;
      --glow1: #ff6b6b;
      --glow2: #ffd166;
      --glow3: #06d6a0;
      --glow4: #4cc9f0;
      --glow5: #a78bfa;
      --glow6: #f72585;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #150c1f 0%, #070b16 40%, #04070f 100%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: saturate(1.3) contrast(1.1);
    }

    .badge {
      position: absolute;
      left: 22px;
      top: 22px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="scene">
    <div class="badge">Crazy Graphics</div>
    <canvas id="c"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const palette = ['#ff6b6b', '#ffd166', '#06d6a0', '#4cc9f0', '#a78bfa', '#f72585'];
    let width = 0;
    let height = 0;
    let pointer = { x: 0.5, y: 0.5 };

    const blobs = Array.from({ length: 8 }, (_, i) => ({
      x: 0,
      y: 0,
      radius: 140 + Math.random() * 220,
      speed: 0.18 + Math.random() * 0.45,
      offset: Math.random() * Math.PI * 2,
      hue: palette[i % palette.length],
      drift: 0.8 + Math.random() * 1.2,
    }));

    const particles = Array.from({ length: 170 }, () => ({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.004,
      vy: (Math.random() - 0.5) * 0.004,
      r: Math.random() * 2.4 + 0.8,
      hue: palette[Math.floor(Math.random() * palette.length)],
      alpha: Math.random() * 0.8 + 0.2,
    }));

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('pointermove', (event) => {
      pointer.x = event.clientX / width;
      pointer.y = event.clientY / height;
    });
    window.addEventListener('resize', resize);
    resize();

    let time = 0;
    function render() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);

      const bg = ctx.createRadialGradient(width * 0.5, height * 0.5, 60, width * 0.5, height * 0.5, width * 0.7);
      bg.addColorStop(0, 'rgba(17, 9, 25, 0.96)');
      bg.addColorStop(0.4, 'rgba(9, 10, 22, 0.85)');
      bg.addColorStop(1, 'rgba(2, 6, 16, 1)');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      blobs.forEach((blob, index) => {
        const cx = width * (0.18 + index * 0.12) + Math.sin(time * blob.speed + blob.offset) * (width * 0.12);
        const cy = height * (0.28 + (index % 4) * 0.16) + Math.cos(time * blob.speed * 1.3 + blob.offset) * (height * 0.12);
        const px = (pointer.x - 0.5) * width * 0.18;
        const py = (pointer.y - 0.5) * height * 0.18;
        const r = blob.radius + Math.sin(time * 1.8 + blob.offset) * 50;

        const grad = ctx.createRadialGradient(cx + px, cy + py, 0, cx + px, cy + py, r);
        grad.addColorStop(0, `${blob.hue}ee`);
        grad.addColorStop(0.28, `${blob.hue}66`);
        grad.addColorStop(0.7, `${blob.hue}11`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx + px, cy + py, r, 0, Math.PI * 2);
        ctx.fill();
      });

      particles.forEach((particle, i) => {
        const driftX = Math.sin(time * 0.7 + particle.x * 20 + i) * 0.23;
        const driftY = Math.cos(time * 0.9 + particle.y * 22 + i) * 0.23;

        particle.x += particle.vx + driftX * 0.003;
        particle.y += particle.vy + driftY * 0.003;

        if (particle.x < 0 || particle.x > 1) particle.vx *= -1;
        if (particle.y < 0 || particle.y > 1) particle.vy *= -1;

        const px = particle.x * width + (pointer.x - 0.5) * width * 0.25;
        const py = particle.y * height + (pointer.y - 0.5) * height * 0.25;

        ctx.beginPath();
        ctx.fillStyle = particle.hue + 'dd';
        ctx.globalAlpha = particle.alpha;
        ctx.arc(px, py, particle.r, 0, Math.PI * 2);
        ctx.fill();

        if (i % 5 === 0) {
          const next = particles[(i + 1) % particles.length];
          const nx = next.x * width + (pointer.x - 0.5) * width * 0.25;
          const ny = next.y * height + (pointer.y - 0.5) * height * 0.25;
          ctx.beginPath();
          ctx.strokeStyle = particle.hue + '55';
          ctx.lineWidth = 0.8;
          ctx.moveTo(px, py);
          ctx.lineTo(nx, ny);
          ctx.stroke();
        }
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
